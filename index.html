<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seif Gaming - 150 Game 🔥</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#fff;font-family:Tahoma}
header{background:#111;padding:15px;text-align:center;border-bottom:3px solid #00ff88;position:sticky;top:0;z-index:100}
h1{color:#00ff88;margin:0}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:15px}
.game{background:#1e1e1e;border-radius:12px;padding:10px;text-align:center;border:1px solid #333;cursor:pointer;transition:.2s}
.game:hover{border-color:#00ff88;transform:scale(1.05)}
.game img{width:100%;height:80px;object-fit:cover;border-radius:8px;background:#222}
.container{display:flex;gap:10px;padding:10px;flex-wrap:wrap;justify-content:center}
.card{background:#1e1e1e;border-radius:15px;padding:15px;width:360px;border:1px solid #333}
.room{padding:10px;margin:8px 0;background:#222;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.room.full{opacity:.5;border:1px solid red}
button{background:#00ff88;color:#000;border:none;padding:8px 14px;border-radius:8px;font-weight:bold;cursor:pointer}
#privateChat{position:fixed;bottom:0;right:10px;width:360px;height:420px;background:#1a1a1a;border:2px solid #00ff88;border-radius:15px 15px 0 0;display:none;flex-direction:column;z-index:999}
#chatHeader{background:#00ff88;color:#000;padding:10px;font-weight:bold;display:flex;justify-content:space-between}
#messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:5px}
.msg{padding:8px 12px;border-radius:10px;max-width:75%;word-break:break-word;text-align:right}
.me{background:#00ff88;color:#000;align-self:flex-start}
.other{background:#333;align-self:flex-end}
#chatInput{display:flex;padding:8px;gap:5px;border-top:1px solid #333}
#chatInput input{flex:1;padding:8px;border-radius:8px;border:none}
.friend{padding:10px;background:#222;margin:5px 0;border-radius:10px;cursor:pointer}
.badge{background:#00ff88;color:#000;padding:2px 8px;border-radius:10px;font-size:12px}
</style>
</head>
<body>
<header>
<h1>🔥 Seif Gaming - 150 لعبة 🔥</h1>
<p>مرحبا <span id="myNameShow" style="color:#00ff88"></span> | <span id="filterInfo">كل الالعاب</span></p>
<input id="searchGame" onkeyup="renderGames()" placeholder="🔍 ابحث عن لعبة..." style="width:90%;max-width:400px;padding:10px;border-radius:20px;border:none;margin-top:10px;text-align:center">
</header>

<div class="games" id="gamesGrid"></div>

<div class="container">
<div class="card"><h3>🎮 الرومات (<span id="roomCount">0</span>/15)</h3><div id="rooms"></div><input id="roomName" placeholder="اسم روم جديد" style="width:65%;padding:8px;border-radius:8px;border:none"><button onclick="createRoom()">انشاء</button></div>
<div class="card"><h3>👥 الأصدقاء</h3><div id="friendsList"></div></div>
<div class="card"><h3>💬 الشات العام</h3><div id="globalChat" style="height:220px;overflow-y:auto;background:#111;border-radius:10px;padding:10px;margin-bottom:8px;text-align:right"></div><div style="display:flex;gap:5px"><input id="globalInput" placeholder="رسالة عامة..." style="flex:1;padding:8px;border-radius:8px;border:none"><button onclick="sendGlobal()">ارسال</button></div></div>
</div>

<div id="privateChat"><div id="chatHeader"><span id="chatWith"></span><span onclick="closeChat()" style="cursor:pointer">X</span></div><div id="messages"></div><div id="chatInput"><input id="msgText" placeholder="رسالة خاصة..."><button onclick="sendPrivate()">➤</button></div></div>

<script>
const firebaseConfig = { apiKey: "ضع-مفتاحك-هنا", authDomain: "seif-gaming.firebaseapp.com", databaseURL: "https://seif-gaming-default-rtdb.firebaseio.com", projectId: "seif-gaming", appId: "1:xxxxx" };
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let myName=localStorage.getItem('myName'); if(!myName){myName=prompt("اسمك:"); localStorage.setItem('myName',myName);} document.getElementById('myNameShow').innerText=myName;
db.ref('users/'+myName).set({online:true}); db.ref('users/'+myName).onDisconnect().remove();
let currentFilter='all';
const gamesList=["Free Fire","PUBG Mobile","Roblox","Fortnite","GTA 5","Minecraft","Call of Duty","Valorant","FIFA 24","eFootball","Clash Royale","Clash of Clans","Among Us","Brawl Stars","Stumble Guys","Fall Guys","Rocket League","League of Legends","Apex Legends","Overwatch 2","Far Cry 6","Resident Evil 4","God of War","Spider-Man 2","The Last of Us","Red Dead 2","Cyberpunk","Assassins Creed","Hitman 3","Forza Horizon 5","Gran Turismo","Need for Speed","CarX Drift","Drift Max Pro","Bus Simulator","Truck Simulator","Subway Surfers","Temple Run","Candy Crush","8 Ball Pool","Ludo King","Chess","Domino","Uno","Poker","Football Master","Dream League","Top Eleven","Score Hero","Worms Zone","Slither.io","Agar.io","Paper.io","Build a Bridge","Craftsman","Block Craft","Mini World","Toca Boca","My Talking Tom","Pou","Cut the Rope","Angry Birds","Plants vs Zombies","Zombie Tsunami","Last Day on Earth","Free Fire Max","PUBG Lite","COD Warzone","Warzone Mobile","Blood Strike","Farlight 84","Knives Out","Rules of Survival","Creative Destruction","FortCraft","Pixel Gun","Guns of Boom","Standoff 2","Critical Ops","Modern Strike","MaskGun","Battle Prime","Shadowgun","Dead Trigger 2","Into the Dead 2","Death Trigger","Sniper 3D","Cover Fire","Hitman Sniper","Sniper Fury","World War Heroes","World of Tanks","War Thunder","World of Warships","BATTLESHIP","Chess Online","Checkers","Backgammon","Solitaire","Spider Solitaire","Hearts","Spades","Rummy","Ludo Supreme","Carrom","Air Hockey","Bowling King","Tennis Clash","Badminton League","Volleyball","Basketball Stars","Baseball 9","Boxing Stars","Wrestling","MMA Fighting","Karate King","Kung Fu","Ninja Arashi","Shadow Fight 2","Shadow Fight 3","Shadow Fight 4","Injustice 2","Mortal Kombat","Street Fighter","Tekken Mobile","Dragon Ball Legends","Naruto X Boruto","One Piece","Bleach","My Hero Academia","Demon Slayer","Attack on Titan","Jujutsu Kaisen","Sonic Dash","Mario Run","Crash Bandicoot","Rayman","Pac-Man","Tetris","Snake Game","Ludo Star","Hago Games","Parchisi Star","Yalla Ludo","Top War","State of Survival","Rise of Kingdoms","Clash of Kings","Lords Mobile","Mobile Legends","Arena of Valor","Vainglory","Onmyoji Arena","Extraordinary Ones","Marvel Super War","Pokemon Unite","Brawlhalla","Smash Legends"];
function renderGames(){
  const q=document.getElementById('searchGame').value.toLowerCase();
  const grid=document.getElementById('gamesGrid'); grid.innerHTML='';
  gamesList.forEach((g,i)=>{
    if(q &&!g.toLowerCase().includes(q)) return;
    if(currentFilter!=='all' && g!==currentFilter) return;
    grid.innerHTML+=`<div class="game" onclick="selectGame('${g}')"><img src="https://via.placeholder.com/140x80/1e1e1e/00ff88?text=${encodeURIComponent(g)}"><div style="margin-top:6px;font-size:13px">${i+1}. ${g}</div></div>`;
  });
}
renderGames();
function selectGame(g){currentFilter=g; document.getElementById('filterInfo').innerText=g; renderGames(); window.scrollTo(0,document.body.scrollHeight);}
function showAll(){currentFilter='all'; document.getElementById('filterInfo').innerText='كل الالعاب'; renderGames();}

function createRoom(){const name=document.getElementById('roomName').value.trim(); if(!name) return; const fullName=currentFilter==='all'?name:`${currentFilter} - ${name}`; db.ref('rooms/'+fullName).set({count:1,max:15,owner:myName,game:currentFilter,players:{[myName]:true}}); document.getElementById('roomName').value='';}
db.ref('rooms').on('value',snap=>{const div=document.getElementById('rooms'); div.innerHTML=''; let c=0; snap.forEach(r=>{const data=r.val(); if(currentFilter!=='all' && data.game!==currentFilter &&!r.key.includes(currentFilter)) return; const count=data.count||Object.keys(data.players||{}).length; const isFull=count>=15; const joined=data.players&&data.players[myName]; c++; div.innerHTML+=`<div class="room ${isFull?'full':''}"><span>${r.key} <span class="badge">${count}/15</span></span><button ${isFull&&!joined?'disabled':''} onclick="joinRoom('${r.key.replace(/'/g,"\\'")}')">${joined?'خروج':'دخول'}</button></div>`;}); document.getElementById('roomCount').innerText=c;});
function joinRoom(name){db.ref('rooms/'+name+'/players/'+myName).once('value',s=>{if(s.exists()){db.ref('rooms/'+name+'/players/'+myName).remove(); db.ref('rooms/'+name+'/count').transaction(c=>(c||1)-1);}else{db.ref('rooms/'+name+'/count').once('value',cs=>{if((cs.val()||0)>=15){alert('الروم مليان 15/15'); return;} db.ref('rooms/'+name+'/players/'+myName).set(true); db.ref('rooms/'+name+'/count').transaction(c=>(c||0)+1);});}});}

let curChatId=null;
db.ref('users').on('value',snap=>{const list=document.getElementById('friendsList'); list.innerHTML=''; snap.forEach(u=>{if(u.key===myName) return; list.innerHTML+=`<div class="friend" onclick="openChat('${u.key}')"><span>👤 ${u.key}</span><span style="float:left">💬 خاص</span></div>`;});});
function getChatId(a,b){return [a,b].sort().join('_SEIF_');}
function openChat(f){curChatId=getChatId(myName,f); document.getElementById('chatWith').innerText=f; document.getElementById('privateChat').style.display='flex'; document.getElementById('messages').innerHTML=''; db.ref('private/'+curChatId).off(); db.ref('private/'+curChatId).limitToLast(50).on('child_added',snap=>{const m=snap.val(); const d=document.createElement('div'); d.className='msg '+(m.from===myName?'me':'other'); d.innerText=m.text; document.getElementById('messages').appendChild(d); document.getElementById('messages').scrollTop=99999;});}
function closeChat(){document.getElementById('privateChat').style.display='none';}
function sendPrivate(){const t=document.getElementById('msgText').value.trim(); if(!t||!curChatId) return; db.ref('private/'+curChatId).push({from:myName,text:t,time:Date.now()}); document.getElementById('msgText').value='';}
db.ref('globalChat').limitToLast(30).on('child_added',snap=>{const m=snap.val(); const d=document.createElement('div'); d.style.padding='5px'; d.style.borderBottom='1px solid #222'; d.innerHTML=`<b style="color:#00ff88">${m.from}:</b> ${m.text}`; document.getElementById('globalChat').appendChild(d); document.getElementById('globalChat').scrollTop=99999;});
function sendGlobal(){const t=document.getElementById('globalInput').value.trim(); if(!t) return; db.ref('globalChat').push({from:myName,text:t}); document.getElementById('globalInput').value='';}
</script>
</body>
</html>
