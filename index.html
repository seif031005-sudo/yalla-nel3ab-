<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>seif - يلا نلعب 🎮</title>
<style>
*{box-sizing:border-box} body{background:#0a0e1c;color:#fff;font-family:sans-serif;margin:0}
.top{background:#151b2e;text-align:center;padding:16px;font-weight:bold;border-bottom:2px solid #5865f2}
.tabs{display:flex;justify-content:space-around;background:#151b2e;padding:8px 0}
.tabs div{padding:12px 15px;cursor:pointer;color:#7a8194;border-radius:10px}
.tabs div.active{color:#fff;background:#222b45}
.searchBox{background:#151b2e;margin:15px;border-radius:14px;padding:4px}
.searchBox input{width:100%;background:#0f1424;border:1px solid #222b45;color:#fff;padding:14px;border-radius:12px;outline:none}
.card{background:#151b2e;margin:10px 12px;padding:14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;border:1px solid #1e2742}
.btn{background:#5865f2;color:#fff;padding:10px 22px;border-radius:10px;border:none;font-weight:bold;cursor:pointer}
.btn:disabled{background:#444}
.btn-full{background:#5865f2;color:#fff;width:95%;padding:16px;border-radius:14px;border:none;font-weight:bold;margin:10px auto;display:block;cursor:pointer}
.btn-del{background:#ff3b5c;color:#fff;border:none;padding:10px 14px;border-radius:10px;cursor:pointer}
.section{display:none}.active-sec{display:block}
.room{background:#151b2e;margin:12px;padding:15px;border-radius:14px;border:1px solid #1e2742;border-right:4px solid #5865f2}
.room.full{border-right-color:#ff3b5c;opacity:0.7}
.modal{position:fixed;top:0;right:0;left:0;bottom:0;background:rgba(5,8,20,0.92);display:none;align-items:center;justify-content:center;z-index:999}
.modal.active{display:flex}
.box{background:#151b2e;padding:20px;border-radius:16px;width:92%;max-width:400px;border:1px solid #222b45}
.box input,.box select,.box textarea{width:100%;padding:12px;margin:8px 0;background:#0f1424;border:1px solid #222b45;color:#fff;border-radius:10px}
.chatBox{height:62vh;overflow:auto;padding:10px}.msg{background:#151b2e;margin:6px 12px;padding:10px;border-radius:10px;border:1px solid #1e2742}.msg b{color:#5865f2}
.chatInput{display:flex;gap:8px;padding:12px;background:#151b2e;position:sticky;bottom:0}
.chatInput input{flex:1;padding:12px;background:#0f1424;border:1px solid #222b45;color:#fff;border-radius:10px}
.friendBox{background:#151b2e;margin:15px;padding:20px;border-radius:14px;border:1px solid #1e2742;text-align:center}
.countBadge{background:#000;border:1px solid #5865f2;padding:4px 10px;border-radius:20px;font-size:12px}
.userBadge{background:#222b45;padding:8px 14px;border-radius:20px;font-size:13px;border:1px solid #5865f2}
#privateBox{position:fixed;bottom:0;right:10px;width:340px;height:400px;background:#151b2e;border:2px solid #5865f2;border-radius:15px 15px 0 0;display:none;flex-direction:column;z-index:1000}
</style>
</head>
<body>
<div class="top"><span id="topUser">seif - يلا نلعب 🎮</span> - اخره 15</div>

<div id="loginModal" class="modal active"><div class="box" style="text-align:center"><h2>🎮 اهلا بيك!</h2><input id="loginInput" placeholder="يوزر نيم انجليزي" maxlength="15"><button class="btn-full" onclick="doLogin()">دخول 🚀</button><p id="loginMsg" style="color:#ff3b5c"></p></div></div>

<div class="tabs">
<div onclick="openTab('friends')" id="tb-friends">👥 الاصدقاء</div>
<div onclick="openTab('chat')" id="tb-chat">دردشة عامة</div>
<div onclick="openTab('rooms')" id="tb-rooms">الرومات 15</div>
<div onclick="openTab('games')" id="tb-games" class="active">الالعاب</div>
</div>

<div id="sec-games" class="section active-sec">
<div style="padding:10px;text-align:left"><span class="userBadge" id="showUser"></span></div>
<div class="searchBox"><input id="q" onkeyup="doSearch()" placeholder="ابحث عن لعبة..."></div>
<div id="gamesList"></div>
</div>

<div id="sec-rooms" class="section"><div style="padding:10px"><button class="btn-full" onclick="openForm()">+ اعمل روم - اخره 15</button></div><div id="roomsList"></div></div>

<div id="sec-chat" class="section"><div id="chatList" class="chatBox"></div><div class="chatInput"><input id="chatText" placeholder="اكتب في العام..."><button class="btn" onclick="sendChat()">ارسال</button></div></div>

<div id="sec-friends" class="section">
<div class="friendBox">
<p>انت: <b id="myNameShow" style="color:#5865f2"></b></p>
<input id="friendSearch" placeholder="اكتب يوزر صاحبك">
<button class="btn-full" onclick="sendFriendReq()">ابعت طلب صداقة ✅</button>
<div style="display:flex;gap:8px;margin-top:15px">
<button class="btn" style="flex:1;background:#222b45" onclick="showFriendsTab('in')">📩 جايلك</button>
<button class="btn" style="flex:1;background:#222b45" onclick="showFriendsTab('out')">📤 بعته</button>
<button class="btn" style="flex:1;background:#5865f2" onclick="showFriendsTab('friends')">✅ اصحابي + خاص</button>
</div>
<div id="friendsResult" style="margin-top:15px;text-align:right"></div>
</div>
</div>

<div id="modal" class="modal"><div class="box"><h3 style="text-align:center">🎮 انشاء روم 15/15</h3><select id="f-game"></select><input type="number" id="f-count" value="15" min="2" max="15"><textarea id="f-desc" placeholder="الوصف"></textarea><input id="f-link" placeholder="لينك"><div style="display:flex;gap:10px"><button class="btn" style="flex:1" onclick="saveRoom()">انشاء</button><button class="btn-del" style="flex:1" onclick="closeForm()">الغاء</button></div></div></div>

<div id="privateBox"><div style="background:#5865f2;padding:10px;display:flex;justify-content:space-between"><span id="privateWith"></span><span onclick="closePrivate()" style="cursor:pointer">X</span></div><div id="privateMsgs" style="flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px"></div><div style="display:flex;gap:5px;padding:8px"><input id="privateText" style="flex:1;padding:10px;background:#0f1424;border:1px solid #222b45;color:#fff;border-radius:10px" placeholder="رسالة خاصة..."><button class="btn" onclick="sendPrivate()">➤</button></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, runTransaction, push, set, get, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyD9Yeq09obz4WjBrJXvFxPjP8IkdbuDt4E", authDomain: "gaming-rooms.firebaseapp.com", databaseURL: "https://gaming-rooms-default-rtdb.firebaseio.com", projectId: "gaming-rooms", storageBucket: "gaming-rooms.firebasestorage.app", messagingSenderId: "325249771955", appId: "1:325249771955:web:1e3e89b4f84891fd6403c6" };
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
let myUsername=localStorage.getItem("myUsername");
const allGames=["Blood Strike","PUBG Mobile","Free Fire","Call of Duty Mobile","Fortnite","Valorant Mobile","Minecraft","Roblox","FIFA","eFootball 26","Asphalt 9","8 Ball Pool","Among Us","Brawl Stars","Clash of Clans","Mobile Legends","XO","Ludo","Domino","Chess"];
let rooms=[]; const gl=document.getElementById('gamesList'); const sel=document.getElementById('f-game'); allGames.forEach(g=>sel.innerHTML+=`<option>${g}</option>`);
function renderGames(arr){gl.innerHTML=""; arr.forEach(g=>{gl.innerHTML+=`<div class="card"><button class="btn" onclick="showRoomsForGame('${g}')">شوف الرومات</button><span>${g}</span></div>`});} renderGames(allGames);
async function checkLogin(){ if(myUsername){document.getElementById('loginModal').classList.remove('active'); document.getElementById('showUser').innerText='👤 '+myUsername; document.getElementById('myNameShow').innerText=myUsername; document.getElementById('topUser').innerText=myUsername+' - 15';} } checkLogin();
window.doLogin=async function(){let name=document.getElementById('loginInput').value.trim().toLowerCase(); if(name.length<3){document.getElementById('loginMsg').innerText='قصير';return} const snap=await get(ref(db,'usernames/'+name)); if(snap.exists() && snap.val()!==localStorage.getItem('myDeviceId')){document.getElementById('loginMsg').innerText='متاخد';return} let d=localStorage.getItem('myDeviceId')||Date.now()+''+Math.random(); localStorage.setItem('myDeviceId',d); await set(ref(db,'usernames/'+name),d); myUsername=name; localStorage.setItem('myUsername',myUsername); checkLogin();}
function roomHTML(r){const full=r.joined>=r.max; return `<div class="room ${full?'full':''}"><div style="display:flex;justify-content:space-between;width:100%"><div style="text-align:right"><b>${r.game} <span class="countBadge">${r.joined}/${r.max}</span></b> ${full?'🔒 15/15':'🟢'}<br><small>صاحبها: ${r.owner}</small><p style="color:#8a90a8">${r.desc||''}</p></div><div style="display:flex;flex-direction:column;gap:6px"><button class="btn" ${full?'disabled':''} onclick="joinRoom('${r._id}')">${r.joinedBy&&r.joinedBy[myUsername]?'خروج':'دخول'}</button>${r.owner===myUsername?`<button class="btn-del" onclick="deleteRoom('${r._id}')">🗑️</button>`:''}</div></div></div>`;}
window.doSearch=function(){let v=document.getElementById('q').value.toLowerCase(); renderGames(allGames.filter(x=>x.toLowerCase().includes(v)));};
window.showRoomsForGame=function(g){openTab('rooms'); let f=rooms.filter(r=>r.game===g); document.getElementById('roomsList').innerHTML=f.length?f.map(roomHTML).join(''):`<div style="text-align:center;padding:30px">مفيش رومات لـ ${g}</div>`;}
window.openTab=function(n){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active-sec')); document.querySelectorAll('.tabs div').forEach(t=>t.classList.remove('active')); document.getElementById('sec-'+n).classList.add('active-sec'); document.getElementById('tb-'+n).classList.add('active'); if(n==='friends') showFriendsTab('friends');}
window.openForm=function(){document.getElementById('modal').classList.add('active');}
window.closeForm=function(){document.getElementById('modal').classList.remove('active');}
onValue(ref(db,'rooms'),snap=>{rooms=[]; snap.forEach(c=>{let r=c.val(); r._id=c.key; rooms.push(r);}); if(document.getElementById('sec-rooms').classList.contains('active-sec')){document.getElementById('roomsList').innerHTML=rooms.map(roomHTML).join('')||'مفيش رومات';}});
window.saveRoom=async function(){let game=document.getElementById('f-game').value; let max=parseInt(document.getElementById('f-count').value); if(max>15) max=15; if(max<2) max=2; let desc=document.getElementById('f-desc').value; let link=document.getElementById('f-link').value; let id=push(ref(db,'rooms')).key; await set(ref(db,'rooms/'+id),{game,max,joined:1,desc,link,owner:myUsername,joinedBy:{[myUsername]:true}}); closeForm(); openTab('rooms');}
window.joinRoom=async function(id){const rRef=ref(db,'rooms/'+id); const snap=await get(rRef); if(!snap.exists()) return; let r=snap.val(); if(r.joinedBy&&r.joinedBy[myUsername]){await runTransaction(rRef,c=>{if(c){c.joined--; delete c.joinedBy[myUsername]; if(c.joined<=0) return null;} return c;});} else {if(r.joined>=15){alert('مليان 15/15');return} await runTransaction(rRef,c=>{if(c){if(c.joined>=c.max) return c; c.joined++; if(!c.joinedBy) c.joinedBy={}; c.joinedBy[myUsername]=true;} return c;});}}
window.deleteRoom=async function(id){await remove(ref(db,'rooms/'+id));}
onValue(ref(db,'chat'),snap=>{const box=document.getElementById('chatList'); box.innerHTML=''; snap.forEach(m=>{let d=m.val(); box.innerHTML+=`<div class="msg"><b>${d.user}:</b> ${d.text}</div>`;}); box.scrollTop=box.scrollHeight;});
window.sendChat=async function(){let t=document.getElementById('chatText').value.trim(); if(!t) return; await push(ref(db,'chat'),{user:myUsername,text:t}); document.getElementById('chatText').value='';}
window.sendFriendReq=async function(){let f=document.getElementById('friendSearch').value.trim().toLowerCase(); if(!f||f===myUsername) return; const u=await get(ref(db,'usernames/'+f)); if(!u.exists()){alert('مش موجود');return} await set(ref(db,`friends/${f}/in/${myUsername}`),{from:myUsername}); await set(ref(db,`friends/${myUsername}/out/${f}`),{to:f}); alert('اتبعتلة');}
window.showFriendsTab=async function(type){const res=document.getElementById('friendsResult'); if(type==='in'){onValue(ref(db,`friends/${myUsername}/in`),snap=>{res.innerHTML='<h4>📩 جايلك</h4>'; if(!snap.exists()){res.innerHTML+='مفيش';return} snap.forEach(s=>{res.innerHTML+=`<div class="card"><span>${s.key}</span><div><button class="btn" onclick="acceptFriend('${s.key}')">قبول ✅</button><button class="btn-del" onclick="rejectFriend('${s.key}')">رفض</button></div></div>`;});},{onlyOnce:true});} else if(type==='out'){onValue(ref(db,`friends/${myUsername}/out`),snap=>{res.innerHTML='<h4>📤 بعته</h4>'; if(!snap.exists()){res.innerHTML+='مفيش';return} snap.forEach(s=>{res.innerHTML+=`<div class="card"><span>${s.key}</span><span>مستني</span></div>`;});},{onlyOnce:true});} else {onValue(ref(db,`friends/${myUsername}/list`),snap=>{res.innerHTML='<h4>✅ اصحابي - دوس عشان خاص 🔥</h4>'; if(!snap.exists()){res.innerHTML+='لسه مفيش';return} snap.forEach(s=>{res.innerHTML+=`<div class="card" style="cursor:pointer" onclick="openPrivate('${s.key}')"><span>👤 ${s.key}</span><span style="color:#00ff88">💬 خاص</span></div>`;});},{onlyOnce:true});}}
window.acceptFriend=async function(name){await set(ref(db,`friends/${myUsername}/list/${name}`),{since:Date.now()}); await set(ref(db,`friends/${name}/list/${myUsername}`),{since:Date.now()}); await remove(ref(db,`friends/${myUsername}/in/${name}`)); await remove(ref(db,`friends/${name}/out/${myUsername}`)); showFriendsTab('friends');}
window.rejectFriend=async function(name){await remove(ref(db,`friends/${myUsername}/in/${name}`)); await remove(ref(db,`friends/${name}/out/${myUsername}`)); showFriendsTab('in');}
let curPrivate=null;
window.openPrivate=function(name){curPrivate=[myUsername,name].sort().join('_SEIF_'); document.getElementById('privateWith').innerText=name; document.getElementById('privateBox').style.display='flex'; onValue(ref(db,'private/'+curPrivate),snap=>{const box=document.getElementById('privateMsgs'); box.innerHTML=''; snap.forEach(m=>{let d=m.val(); box.innerHTML+=`<div style="padding:8px 12px;border-radius:10px;max-width:80%;${d.from===myUsername?'background:#5865f2;align-self:flex-start':'background:#222b45;align-self:flex-end'}">${d.text}</div>`;}); box.scrollTop=box.scrollHeight;});}
window.closePrivate=function(){document.getElementById('privateBox').style.display='none';}
window.sendPrivate=async function(){let t=document.getElementById('privateText').value.trim(); if(!t||!curPrivate) return; await push(ref(db,'private/'+curPrivate),{from:myUsername,text:t}); document.getElementById('privateText').value='';}
</script>
</body>
</html>
